<body>

    <!-- NAVIGATION -->
    <nav class="navbar">

        <div class="logo">
            ABC Tutoring
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#tutors">Find a Tutor</a>
            <a href="index.html#contact">Contact</a>
        </div>

    </nav>


    <!-- BOOKING FORM -->
    <main class="booking-page">

        <div class="booking-container">

            <p class="eyebrow">
                BOOK A SESSION
            </p>

            <h1>
                Tell us about your student
            </h1>

            <p class="booking-intro">
                Fill out the information below to request a tutoring session.
            </p>


            <form id="bookingForm">

                <!-- SELECTED TUTOR -->
                <div class="form-group">

                    <label for="tutor">
                        Tutor
                    </label>

                    <input
                        type="text"
                        id="tutor"
                        name="tutor"
                        readonly
                    >

                </div>


                <!-- PARENT NAME -->
                <div class="form-group">

                    <label for="parentName">
                        Parent or Guardian Name
                    </label>

                    <input
                        type="text"
                        id="parentName"
                        name="parentName"
                        required
                    >

                </div>


                <!-- PARENT EMAIL -->
                <div class="form-group">

                    <label for="parentEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="parentEmail"
                        name="parentEmail"
                        required
                    >

                </div>


                <!-- STUDENT NAME -->
                <div class="form-group">

                    <label for="studentName">
                        Student First Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        name="studentName"
                        required
                    >

                </div>


                <!-- STUDENT GRADE -->
                <div class="form-group">

                    <label for="grade">
                        Student Grade
                    </label>

                    <select
                        id="grade"
                        name="grade"
                        required
                    >

                        <option value="">
                            Select grade
                        </option>

                        <option>3rd</option>
                        <option>4th</option>
                        <option>5th</option>
                        <option>6th</option>
                        <option>7th</option>
                        <option>8th</option>
                        <option>9th</option>
                        <option>10th</option>
                        <option>11th</option>
                        <option>12th</option>

                    </select>

                </div>


                <!-- SUBJECT -->
                <div class="form-group">

                    <label for="subject">
                        Requested Subject
                    </label>

                    <select
                        id="subject"
                        name="subject"
                        required
                    >

                        <option value="">
                            Select a subject
                        </option>

                        <option>Math</option>
                        <option>Algebra</option>
                        <option>Geometry</option>
                        <option>Biology</option>
                        <option>Chemistry</option>
                        <option>Science</option>
                        <option>English</option>
                        <option>Writing</option>
                        <option>Reading</option>

                    </select>

                </div>


                <!-- DATE -->
                <div class="form-group">

                    <label for="date">
                        Preferred Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>


                <!-- TIME -->
                <div class="form-group">

                    <label for="time">
                        Preferred Time
                    </label>

                    <input
                        type="time"
                        id="time"
                        name="time"
                        required
                    >

                </div>


                <!-- CONFIRM -->
                <button
                    type="submit"
                    class="primary-button booking-submit"
                >
                    Confirm Booking
                </button>

            </form>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
