<body>

    <!-- NAVIGATION -->
    <nav class="navbar">

        <div class="logo">
            ABC Tutoring
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#tutors">Find a Tutor</a>
            <a href="index.html#how-it-works">How It Works</a>
            <a href="index.html#contact">Contact</a>
        </div>

    </nav>


    <!-- PROFILE PAGE -->
    <main class="profile-page">

        <div class="profile-container">

            <!-- PHOTO -->
            <div
                id="profilePhoto"
                class="profile-photo">
            </div>


            <!-- PROFILE INFO -->
            <div class="profile-info">

                <p class="eyebrow">
                    TUTOR PROFILE
                </p>

                <h1 id="profileName">
                    Tutor Name
                </h1>

                <p
                    id="profileSubjects"
                    class="profile-subjects">
                </p>

                <div class="profile-details">

                    <p>
                        <strong>Grade Levels:</strong>
                        <span id="profileGrades"></span>
                    </p>

                    <p>
                        <strong>Hourly Rate:</strong>
                        <span id="profileRate"></span>
                    </p>

                    <p>
                        <strong>Availability:</strong>
                        <span id="profileAvailability"></span>
                    </p>

                </div>


                <div class="profile-about">

                    <h2>
                        About
                    </h2>

                    <p id="profileBio">
                    </p>

                </div>


                <div class="profile-actions">

                    <button
                        id="profileBookButton"
                        class="primary-button">
                        Book This Tutor
                    </button>

                    <a
                        href="index.html#tutors"
                        class="secondary-link">
                        Back to Tutors
                    </a>

                </div>

            </div>

        </div>

    </main>


    <script src="script.js"></script>
